name: api-health
# 19.10.2026: one click (or `gh workflow run api-health.yml`) → is the 2.0 API up, is the home feed fresh, and which keys the
# server has (only yes/no: AI agent, Firebase admin for pushes + account deletion, BingX partner for the VIP check), how the
# last NOVA question went (agent_last) and the public NOVA feed (greeting, starter questions, topics).
# 21.10: /v2/agent/selftest — one real NOVA answer end to end (result, time, the first words).
# 20.10: the languages — /v2/home?lang=en (the English home: lang, a few of its texts) and /v2/feed/nova?lang=el (the Greek intro).
# 22.10: /v2/home "news" in ru / uk / el; /v2/health news_last = the last translation call.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: GET /v2/health
        run: |
          set -u
          body=$(curl -sS -m 20 https://app.crypto-capital.app/v2/health || echo '{"ok":false,"error":"unreachable"}')
          echo "$body"
          echo "::notice title=health::$body"
          # 21.10: a real NOVA call through the server (same prompt and model as the app; one real call per 10 min, else cached)
          st=$(curl -sS -m 40 -w '\n%{http_code} %{time_total}s' https://app.crypto-capital.app/v2/agent/selftest || printf '{}\n000')
          echo "::notice title=nova selftest::$(echo "$st" | tail -n 1) · $(echo "$st" | sed '$d' | jq -c '{result, ms, cached, age_sec, model, finish, error, answer_head}' 2>/dev/null || echo "$st" | head -c 300)"
          diag=$(curl -sS -m 20 https://app.crypto-capital.app/v2/diag || echo '{}')
          echo "::notice title=diag::$diag"
          home=$(curl -sS -m 20 -o /dev/null -w '%{http_code}' https://app.crypto-capital.app/v2/home || echo 000)
          echo "::notice title=home::HTTP $home"
          noauth=$(curl -sS -m 20 -o /dev/null -w '%{http_code}' -X POST https://app.crypto-capital.app/v2/me || echo 000)
          echo "::notice title=auth::POST /v2/me without a token → HTTP $noauth (401 expected)"
          nova=$(curl -sS -m 20 -w '\n%{http_code}' https://app.crypto-capital.app/v2/feed/nova || printf '{}\n000')
          code=$(echo "$nova" | tail -n 1)
          summary=$(echo "$nova" | sed '$d' | jq -c '{greeting: ((.greeting // "") | .[0:90]), greeting_vip: ((.greeting_vip // "") | length > 0), suggest: ((.suggest // []) | length), topics: [(.topics // [])[] | "\(.title) (\(.qs | length))"]}' 2>/dev/null || echo "not JSON")
          echo "::notice title=nova feed::GET /v2/feed/nova → HTTP $code · $summary"
          en=$(curl -sS -m 20 -w '\n%{http_code}' 'https://app.crypto-capital.app/v2/home?lang=en' || printf '{}\n000')
          code=$(echo "$en" | tail -n 1)
          summary=$(echo "$en" | sed '$d' | jq -c '{lang, age_sec: (if .asof then ((now * 1000 - .asof) / 1000 | floor) else null end), note: .note_ru, soon: ([.sources[]? | select(.key == "soon") | .label][0]), status: ((.futures.status_ru // "") | .[0:90]), open: ((.futures.open // []) | length), first: ((.futures.open // [])[0] | if . then {sym, why_title, src_ru, check: ((.checks // [])[0] | if . then "\(.t): \(.v)" else null end)} else null end), alloc: [(.spot.alloc // [])[].name], last_action: ((.spot.last_action.text // "") | .[0:90])}' 2>/dev/null || echo "not JSON")
          echo "::notice title=home en::GET /v2/home?lang=en → HTTP $code · $summary"
          # 22.10: «Главные новости рынка» (/v2/home "news") — what the app shows in 3 languages (a story is translated once, in the
          # background, after the first request that sees it: a second run shows the translations)
          for l in ru uk el; do
            nw=$(curl -sS -m 20 "https://app.crypto-capital.app/v2/home?lang=$l" | jq -c '[(.news // [])[] | {asset, direction, magnitude, title, meaning}]' 2>/dev/null || echo "not JSON")
            echo "::notice title=news $l::$(echo "$nw" | cut -c1-3800)"
          done
          el=$(curl -sS -m 20 -w '\n%{http_code}' 'https://app.crypto-capital.app/v2/feed/nova?lang=el' || printf '{}\n000')
          code=$(echo "$el" | tail -n 1)
          summary=$(echo "$el" | sed '$d' | jq -c '{lang, greeting: ((.greeting // "") | .[0:90]), greeting_vip: ((.greeting_vip // "") | .[0:90]), suggest: ((.suggest // []) | .[0:3]), topics: [(.topics // [])[] | "\(.title) (\(.qs | length))"]}' 2>/dev/null || echo "not JSON")
          echo "::notice title=nova feed el::GET /v2/feed/nova?lang=el → HTTP $code · $summary"
      - name: build 46 home (a step of its own — GitHub keeps 10 notices a step)
        run: |
          # 28.10 (build 46): the PUBLIC mode's real account, the market in plain words, the spot actions, the demo stats
          b46=$(curl -sS -m 20 'https://app.crypto-capital.app/v2/home?lang=ru' | jq -c '{pp: (.public_portfolio | if . then {since, start_usd, value_usd, pnl_usd, stale, day: .periods.day, spot_day: .spot.periods.day.available, fut_open: .futures.open_n, fut_stats: .futures.stats, actions: (.actions | length), last: (.actions[0].text // null)} else null end), mv: (.market_view | if . then {now, short, system} else null end), spot_actions: ((.spot.actions // []) | length), demo_stats: .futures.stats}' 2>/dev/null || echo "not JSON")
          echo "::notice title=build 46 home::$(echo "$b46" | cut -c1-3800)"
      - name: build 46 QA (28.10) — plain words, transfers, the real futures record, the FAQ
        run: |
          A=https://app.crypto-capital.app
          q=$(curl -sS -m 20 "$A/v2/home?lang=ru" | jq -c '{spot: (.public_portfolio.spot | if . then {value_usd, moved_usd, moved_note} else null end), fut: (.public_portfolio.futures | if . then {value_usd, moved_usd} else null end), fut_why_tail: ((.public.calc.futures_why // "") | .[-120:]), coin: ((.spot.coins // [])[] | select(.sym == "SOL") | {live_share, why_ru, mark_ru, reco_ru}), last: .spot.last_action.text, buy: [(.buy_now.items // [])[0:2][] | .why]}' 2>/dev/null || echo "not JSON")
          echo "::notice title=QA home ru::$(echo "$q" | cut -c1-3800)"
          f=$(curl -sS -m 20 "$A/v2/feed/nova" | jq -c '{brand_nbsp: ((.topics[0].title // "") | test("CRYPTO\u00a0NOVA")), title: .topics[0].title}' 2>/dev/null || echo "?")
          echo "::notice title=QA nova feed::$f"
      - name: NOVA's voice on the server (build 46 #6)
        run: |
          set -u
          A=https://app.crypto-capital.app
          ready=$(curl -sS -m 20 $A/v2/health | jq -c '{tts: .ready.tts, tts_last}' 2>/dev/null || echo "?")
          echo "::notice title=tts ready::$ready"
          for l in ru en; do
            if [ "$l" = ru ]; then txt="Привет! Я NOVA AI. Публичный портфель CRYPTO NOVA сейчас — 9 896 долларов."; else txt="Hi! I'm NOVA AI. The CRYPTO NOVA public portfolio is now at 9,896 dollars."; fi
            r=$(jq -nc --arg t "$txt" --arg l "$l" '{text: $t, lang: $l}' | curl -sS -m 40 -o tts_$l.bin -D h_$l.txt -w '%{http_code} %{time_total}s %{size_download}B' -X POST -H 'content-type: application/json' --data-binary @- $A/v2/tts || echo "000")
            ct=$(tr -d '\r' < h_$l.txt | grep -i '^content-type' | head -1)
            kind=$(file -b tts_$l.bin | cut -c1-60)
            echo "::notice title=POST /v2/tts $l::HTTP $r · $ct · $kind · $(head -c 120 tts_$l.bin | tr -dc '[:print:]' | head -c 120)"
          done
          for l in ru en; do
            u=$(curl -sS -m 20 "$A/v2/home?lang=$l" | jq -r '.report.audio_url // empty')
            t=$(curl -sS -m 20 "$A/v2/home?lang=$l" | jq -r '.report.text // empty' | cut -c1-200)
            if [ -n "$u" ]; then r=$(curl -sS -m 40 -o rep_$l.bin -w '%{http_code} %{time_total}s %{size_download}B' "$u" || echo 000); else r="no audio_url"; fi
            echo "::notice title=report $l::$r · $u · $t"
          done

  tts-code:
    # 28.10 (build 46 #6): the server's own synthesis code (cnq/api/tts.py synth) against the real edge-tts and Microsoft's voices,
    # on a runner — proves the code before / independently of the server's install
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q "edge-tts>=7"
      - name: synth ru / en / uk / el / es
        run: |
          python - <<'PY'
          import time
          from cnq.api import tts
          T = {"ru": "Публичный портфель CRYPTO NOVA сейчас — 9 886 долларов. Я NOVA AI.", "en": "The CRYPTO NOVA public portfolio is now at 9,886 dollars.",
               "uk": "Публічний портфель CRYPTO NOVA зараз — 9 886 доларів.", "el": "Το δημόσιο χαρτοφυλάκιο του CRYPTO NOVA είναι τώρα στα 9 886 δολάρια.",
               "es": "La cartera pública de CRYPTO NOVA está ahora en 9 886 dólares."}
          for lang, text in T.items():
              t0 = time.time()
              try:
                  b = tts.synth(text, lang)
                  ok = b[:3] == b"ID3" or b[:2] in (b"\xff\xf3", b"\xff\xfb", b"\xff\xf2")
                  print(f"::notice title=synth {lang}::{tts.VOICES[lang]} · {len(b)} bytes · mp3 {ok} · {time.time() - t0:.1f} s")
              except Exception as e:
                  print(f"::notice title=synth {lang}::FAILED {e}")
          PY
