name: research-bn-whales
# 05.11: Binance lead traders — copy delay, stop distance / leverage, hold time (scripts/research/bn_whale_stops.py). Read-only:
# restores the state cache to read ws_trips, never saves it. Results in the run's annotations and the artifact.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "stops (bn_whale_stops.py), size (backlog 92), impulse (backlog 96), delay (backlog 88), daystop (backlog 90), join (backlog 103), regime (backlog 102), dispute (backlog 112), book (backlog 101), cohort (backlog 106), fresh (backlog 116), lockloss (backlog 117) or norepeat (backlog 123)"
        type: choice
        options: [stops, size, impulse, delay, daystop, join, regime, dispute, book, cohort, fresh, lockloss, norepeat]
        default: stops
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Restore the state cache (read only)
        uses: actions/cache/restore@v4
        with:
          path: |
            data/cnq.sqlite
            data/agents.sqlite
            data/whales_ext.sqlite
          key: cnq-state-none
          restore-keys: |
            cnq-state-
      - run: python scripts/research/bn_whale_${{ inputs.mode || 'stops' }}.py data/agents.sqlite bn_whale_${{ inputs.mode || 'stops' }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bn-whale-${{ inputs.mode || 'stops' }}
          path: bn_whale_${{ inputs.mode || 'stops' }}.json
