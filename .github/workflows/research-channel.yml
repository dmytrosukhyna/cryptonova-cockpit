name: research-channel
# Manual only. An honest check of a PUBLIC Telegram trading channel (t.me/s/<channel> web preview, no login):
# scripts/channel_audit.py → aggregate numbers only (annotations + job summary); no post texts are stored.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "public channel username"
        required: true
        default: "Mr_Trader_Pro"
      days:
        description: "how many days back"
        required: false
        default: "200"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy
      - run: python scripts/channel_audit.py --channel "${{ inputs.channel }}" --days "${{ inputs.days }}"
