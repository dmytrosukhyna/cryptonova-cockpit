name: research-market-view-history
# 20.11 (backlog 217): «Направление рынка» history study — which public signals (funding, OI, long/short, book ±1%, regime,
# S&P 500) predicted strong BTC/ETH moves 1–3 days ahead in 2023–2026, plus the copy «side filter». Public files only
# (data.binance.vision, stooq), no keys, no trading. Manual only (dispatched by the analyst's daily 09:23 run).
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: market-view-history, cancel-in-progress: false }
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with: { path: /tmp/mvcache, key: mvhist-${{ github.run_id }}, restore-keys: mvhist- }
      - name: Study
        run: python scripts/research/market_view_history.py docs/research/market_view_history.md docs/research/market_view_history.json
      - name: Commit
        run: |
          git config user.name "cnq-bot"; git config user.email "cnq-bot@users.noreply.github.com"
          git add docs/research/market_view_history.md docs/research/market_view_history.json && git commit -q -m "market-view: history study [skip ci]" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep $((i*7)); done
