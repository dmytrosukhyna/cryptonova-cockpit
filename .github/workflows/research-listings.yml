name: research-listings
# Manual only. «Шорт новых листингов» study: scripts/listings_study.py on the Binance public archive (every USDT-M perp listed
# 2023-01 or later, delisted included, 1h klines + funding). Result: job summary + annotations + artifact listings (7 days).
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy
      - run: python scripts/listings_study.py --out listings.json --splits
      - uses: actions/upload-artifact@v4
        with: { name: listings, path: listings.json, retention-days: 7 }
