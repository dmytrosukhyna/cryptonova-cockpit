name: autolab
# «Автолаборатория» (scripts/autolab.py): every night re-tests all rule families on crypto, metals, stock indices, oil and
# Treasuries with a walk-forward check, compares the live demo desks with their history, writes web/autolab.json.
# Nothing trades; promotion into a demo desk or any real money stays a human decision.
on:
  schedule:
    - cron: "41 2 * * *"        # every night, 05:41 Athens
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autolab
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q numpy
      - run: python scripts/autolab.py
      - name: Commit web/autolab.json
        run: |
          git config user.name "cnq-bot"
          git config user.email "cnq-bot@users.noreply.github.com"
          git add web/autolab.json
          git commit -m "autolab: nightly $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "nothing to commit"
          for i in 1 2 3 4; do git fetch origin main && git rebase -X theirs origin/main && git push origin HEAD:main && break || { git rebase --abort || true; sleep 20; }; done
