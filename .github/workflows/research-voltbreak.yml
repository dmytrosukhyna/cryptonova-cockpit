name: research-voltbreak
# Manual only. Volatility breakout on every Binance USDT-M perp, delisted included (scripts/voltbreak_all_study.py,
# backlog #5 + #33). Public data only: no keys, no secrets, no orders.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "all"
        required: false
        default: "all"

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q numpy
      - run: python scripts/voltbreak_all_study.py
