name: research-anatomy
# 10.11: backlog 126 — own strategy from the anatomy of the locked whales' decisions (scripts/research/anatomy126.py).
# Read-only: restores the state cache to read ws_trips, never saves it. Results in the run's annotations and the artifact.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "anatomy126"
        type: choice
        options: [anatomy126]
        default: anatomy126
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Restore the state cache (read only)
        uses: actions/cache/restore@v4
        with:
          path: |
            data/cnq.sqlite
            data/agents.sqlite
            data/whales_ext.sqlite
          key: cnq-state-none
          restore-keys: |
            cnq-state-
      - run: python scripts/research/${{ inputs.mode || 'anatomy126' }}.py data/agents.sqlite ${{ inputs.mode || 'anatomy126' }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.mode || 'anatomy126' }}
          path: ${{ inputs.mode || 'anatomy126' }}.json
