name: research-listing-short
# Manual only. RESEARCH ONLY (paper): short new perpetual listings (scripts/listing_short_study.py, owner 12.11).
# No orders, no keys. Results are published as job annotations. Nothing is committed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/listing_short_study.py
