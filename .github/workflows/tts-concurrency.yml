name: tts-concurrency
# TEMPORARY (29.10.2026): on the server Brian's first audio takes 3.6–6.1 s (0.3 s on a runner) while the background report
# makes of 5 languages run on the same IP. Does concurrency slow a live Russian answer? A live answer (cnq/api/tts.py synth,
# live=True) alone vs with the 5 languages' reports made at the same time, and Brian alone. Removed afterwards.
on:
  workflow_dispatch:
    inputs:
      rounds: { description: "rounds", default: "6" }

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q "edge-tts>=7,<8"
      - run: for l in ru en uk el es; do curl -sS -m 20 "https://app.crypto-capital.app/v2/home?lang=$l" -o home_$l.json || echo '{}' > home_$l.json; done
      - name: every male multilingual voice now (first audio / total ms, a fresh Russian answer) — interleaved rounds
        env: { ROUNDS: "${{ inputs.rounds }}" }
        run: |
          python - <<'PY'
          import os, random, statistics, time
          from cnq.api import tts
          VS = ["en-US-BrianMultilingualNeural", "en-AU-WilliamMultilingualNeural", "en-US-AndrewMultilingualNeural", "de-DE-FlorianMultilingualNeural",
                "fr-FR-RemyMultilingualNeural", "it-IT-GiuseppeMultilingualNeural", "ko-KR-HyunsuMultilingualNeural", "uk-UA-OstapNeural"]
          res = {}
          for r in range(int(os.environ.get("ROUNDS") or 6)):
              order = VS[:]
              random.shuffle(order)
              for v in order:
                  tts.VOICES["ru"] = v                       # this voice only (FALLBACK filtered when equal; others → patient fallback)
                  tts.FALLBACK["ru"] = v
                  t = f"Ответ NOVA AI номер {r + 1} {v[:5]}: биткоин стоит 80 058 долларов, за сутки минус 1,7 процента, а эфир около 3 900 долларов."
                  try:
                      tts.synth(t, "ru", live=True)
                  except Exception:
                      pass
                  a = (tts._used.attempts or [{}])[0]
                  res.setdefault(v, []).append((a.get("first_audio_ms"), a.get("ms"), a.get("outcome")))
                  print(r, v, res[v][-1], flush=True)
              time.sleep(4)
          for v, xs in res.items():
              f = sorted(x[0] for x in xs if x[0] is not None)
              tot = sorted(x[1] for x in xs if x[2] == "ok")
              print(f"::notice title={v}::first audio median {statistics.median(f) if f else None} ms {f} · total median {statistics.median(tot) if tot else None} ms {tot} · {[x[2] for x in xs]}")
          PY
