name: nova-probe
# 20.10.2026: ask the real model (the same key as the server's NOVA) a few app questions and show, as notices, the time, why
# the model stopped and the answer. mode=new → the live NOVA path (cnq/api/nova.py); mode=old → the prompt before 20.10.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "new | old"
        default: "new"
      questions:
        description: "extra questions for mode=new, separated by |"
        default: ""

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pyjwt cryptography
      - run: python scripts/nova_probe.py "$MODE"
        env:
          MODE: ${{ inputs.mode }}
          NOVA_PROBE_QS: ${{ inputs.questions }}
          CNQ_LLM_KEY: ${{ secrets.CNQ_LLM_KEY }}
          CNQ_LLM_PROVIDER: ${{ vars.CNQ_LLM_PROVIDER }}
          CNQ_LLM_MODEL: ${{ vars.CNQ_LLM_MODEL }}
