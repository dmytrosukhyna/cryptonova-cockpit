name: research-macro
# Manual only (no schedule). Macro factor history for docs/research/macro_factors.md: Yahoo via yfinance (index futures, DXY,
# USDJPY, oil, gold, 10Y, VIX, Nikkei — daily since 2021, hourly 730 days), US Treasury yields, CBOE VIX, NY Fed reverse repo,
# Treasury cash balance, FRED (best effort) + a probe of live sources for cnq/agents/macro_watch.py. The research container cannot reach these sites and
# cannot download artifacts or logs, so the packed data come back as job annotations (scripts/macro_factors_fetch.py
# --decode). Nothing is committed.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "data = download history + publish as annotations; watch = dry run of cnq/agents/macro_watch.py (with and without Yahoo)"
        required: false
        default: "data"

permissions:
  contents: read

jobs:
  watch:
    if: inputs.mode == 'watch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q numpy
      - name: macro_watch without curl_cffi (Yahoo via urllib, then Treasury / CBOE / ECB fallbacks)
        run: |
          python - <<'PY'
          import json
          from cnq.agents import macro_watch as mw
          d = mw.run()
          s = json.dumps({"items": [[i["key"], i["value"], i["chg_1d"], i["chg_5d"], i["source"], i["asof"], i["signal_ru"][:40]] for i in d["items"]], "errors": d["errors"]}, ensure_ascii=False)
          print("::notice title=watch urllib::" + s[:3900].replace("%", "%25"))
          PY
      - run: pip install -q curl_cffi
      - name: macro_watch with curl_cffi (as in site.yml)
        run: |
          python -m cnq.cli macro --out probe_web
          python - <<'PY'
          import json
          d = json.load(open("probe_web/macro.json"))
          s = json.dumps({"items": [[i["key"], i["value"], i["chg_1d"], i["chg_5d"], i["source"], i["asof"], i["signal_ru"][:40]] for i in d["items"]], "errors": d["errors"]}, ensure_ascii=False)
          print("::notice title=watch curl_cffi::" + s[:3900].replace("%", "%25"))
          PY

  fetch:
    if: inputs.mode != 'watch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q yfinance
      - name: Probe live sources
        continue-on-error: true
        timeout-minutes: 5
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
        run: |
          python scripts/macro_factors_fetch.py --probe probe.md
          python - <<'PY'
          s = open("probe.md").read()[:3900].replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print(f"::notice title=probe::{s}")
          PY
      - name: Download history
        timeout-minutes: 15
        run: python scripts/macro_factors_fetch.py --fetch pack.b64 --md status.md
      - uses: actions/upload-artifact@v4
        with: { name: macro-pack, path: pack.b64, retention-days: 3 }
      - name: Publish status + probe
        if: always()
        run: |
          python - <<'PY'
          import os
          for f, title in (("status.md", "status"),):
              s = open(f).read() if os.path.exists(f) else "(no file)"
              n = 3500; parts = [s[i:i + n] for i in range(0, len(s), n)][:8]
              for j, p in enumerate(parts):
                  p = p.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                  print(f"::notice title={title} {j + 1}/{len(parts)}::{p}")
          PY

  publish:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: macro-pack }
      # ≤ 10 annotations per level per step, ≤ 50 per job → 48 chunks per shard in three steps
      - run: python scripts/macro_factors_fetch.py --emit pack.b64 $(( ${{ matrix.shard }} * 48 )) 20
      - run: python scripts/macro_factors_fetch.py --emit pack.b64 $(( ${{ matrix.shard }} * 48 + 20 )) 20
      - run: python scripts/macro_factors_fetch.py --emit pack.b64 $(( ${{ matrix.shard }} * 48 + 40 )) 8
