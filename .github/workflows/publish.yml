name: publish
# 19.10.2026: the server engine pushes the demo desks every 2–3 minutes; this only re-publishes web/ to the site (≈ 40 s),
# at most once in 8 minutes (GitHub Pages builds have a soft limit of 10 an hour). The full pipeline is site.yml.
on:
  push:
    branches: [main]
    paths: ["web/paper.json", "web/signals_feed.json", "web/engine.json", "web/app_home.json", "web/app_home.*.json", "web/bybit.json", "web/ivan.enc.json", "web/owner.enc.json", "web/public_real.json", "web/ivan_stats.json"]

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Throttle (the last publish less than 8 minutes ago → skip)
        id: gate
        run: |
          git fetch -q --depth=1 origin gh-pages || true
          last=$(git log -1 --format=%ct FETCH_HEAD 2>/dev/null || echo 0)
          age=$(( $(date +%s) - last ))
          echo "last publish ${age}s ago"
          if [ "$age" -lt 480 ]; then echo "go=false" >> "$GITHUB_OUTPUT"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - name: Publish web/ to gh-pages
        if: steps.gate.outputs.go == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          force_orphan: true
          cname: cryptonova.vip
