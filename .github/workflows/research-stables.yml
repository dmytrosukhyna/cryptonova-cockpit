name: research-stables
# Manual only. «Свободные стейблы»: where idle stablecoins earn the most for the risk — DefiLlama stablecoin pools ≥ $100M with
# a year of history, Pendle fixed rate, Hyperliquid HLP, funding carry BTC/ETH 2023 → today. scripts/stables_study.py.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy
      - run: python scripts/stables_study.py
