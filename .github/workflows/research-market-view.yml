name: research-market-view
# 19.11: «Направление рынка» analyst — public derivatives snapshot (funding, OI, long/short, taker flow, books ±1–2%, liquidations,
# Deribit put/call, skew, DVOL) for BTC/ETH/SOL. scripts/research/market_view_snapshot.py. Public read-only APIs, no keys, no trading.
# Manual only (dispatched by the analyst session every 4 h). Snapshot is committed to data/market_view/snap/ (artifacts are not readable
# from the sessions).
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: market-view, cancel-in-progress: false }
jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Snapshot
        run: |
          mkdir -p data/market_view/snap
          F=data/market_view/snap/$(date -u +%Y-%m-%dT%H%M).json
          python scripts/research/market_view_snapshot.py "$F"
          echo "F=$F" >> $GITHUB_ENV
      - name: Commit snapshot
        run: |
          git config user.name "cnq-bot"; git config user.email "cnq-bot@users.noreply.github.com"
          git add -f data/market_view/snap && git commit -q -m "market-view: snapshot [skip ci]" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep $((i*7)); done
