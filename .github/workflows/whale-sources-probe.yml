name: whale-sources-probe
# 04.11: which copy-trading sources (Binance lead portfolios, Bybit masters, Bitget, MEXC, Gate, Hyperliquid) answer from a runner
# with live positions and history → annotations of the run (check-runs API). Runs when the probe changes.
on:
  push:
    branches: [main]
    paths: ["scripts/whale_sources_probe.py", ".github/workflows/whale-sources-probe.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/whale_sources_probe.py data/research/whale_sources_probe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: whale-sources-probe, path: data/research/whale_sources_probe.json, retention-days: 7 }
