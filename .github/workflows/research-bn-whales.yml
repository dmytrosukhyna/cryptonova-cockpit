name: research-bn-whales
# 05.11: Binance lead traders — copy delay, stop distance / leverage, hold time (scripts/research/bn_whale_stops.py). Read-only:
# restores the state cache to read ws_trips, never saves it. Results in the run's annotations and the artifact.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "stops (bn_whale_stops.py), size (backlog 92), impulse (backlog 96), delay (backlog 88), daystop (backlog 90), join (backlog 103), regime (backlog 102), dispute (backlog 112), book (backlog 101), cohort (backlog 106), fresh (backlog 116), lockloss (backlog 117), norepeat (backlog 123), trail (backlog 130), same2 (backlog 131), side (backlog 132), agree (backlog 127), rotbar (backlog 139), hedge (backlog 129), exitanat (backlog 135) early (backlog 144), selag (backlog 146), selroll (backlog 149) sel21 (backlog 152), joindepth (backlog 164), fastexit (backlog 165) ret172 (backlog 172), lastexit (backlog 198) drift (backlog 200), timestop (backlog 219), lag228 (backlog 228), ivan233 (backlog 233), map232 (backlog 232), flip245 (backlog 245), rev249 (backlog 249), bar250 (backlog 250), rank253 (backlog 253), reopen256 (backlog 256), probe257 (backlog 257), early258 (backlog 258), curse255 (backlog 255), qexit266 (backlog 266), bq263 (backlog 263), liq271 (backlog 271), liq274 (backlog 274), stop275 (backlog 275) reent276 (backlog 276), q1tail270 (backlog 270) or pit262 (backlog 262)"
        type: choice
        options: [stops, size, impulse, delay, daystop, join, regime, dispute, book, cohort, fresh, lockloss, norepeat, trail, same2, side, agree, rotbar, hedge, exitanat, early, selag, selroll, sel21, joindepth, fastexit, ret172, lastexit, drift, timestop, lag228, ivan233, map232, flip245, rev249, bar250, rank253, reopen256, probe257, early258, curse255, qexit266, bq263, liq271, liq274, stop275, reent276, q1tail270, pit262]
        default: stops
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Restore the state cache (read only)
        uses: actions/cache/restore@v4
        with:
          path: |
            data/cnq.sqlite
            data/agents.sqlite
            data/whales_ext.sqlite
          key: cnq-state-none
          restore-keys: |
            cnq-state-
      - run: python scripts/research/bn_whale_${{ inputs.mode || 'stops' }}.py data/agents.sqlite bn_whale_${{ inputs.mode || 'stops' }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bn-whale-${{ inputs.mode || 'stops' }}
          path: bn_whale_${{ inputs.mode || 'stops' }}.json
