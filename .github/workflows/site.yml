name: refresh-and-deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"      # данные + отдел новостей каждые 30 минут (UTC)
    - cron: "5 22 * * 0"        # гэпы понедельника по валютам, воскресенье 22:05 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy
      - name: Restore candle store
        uses: actions/cache@v4
        with:
          path: data/cnq.sqlite
          key: cnq-db-${{ github.run_id }}
          restore-keys: cnq-db-
      - name: Candles (BingX, 15m, 400 days)
        continue-on-error: true
        run: python scripts/ci_refresh.py
      - name: Departments → web/terminal.json + web/decision.json
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CNQ_LLM_MODEL: ${{ vars.CNQ_LLM_MODEL }}
          CNQ_TG_TOKEN: ${{ secrets.CNQ_TG_TOKEN }}
          CNQ_TG_CHAT: ${{ secrets.CNQ_TG_CHAT }}
        run: python -m cnq.cli agents --out web
      - name: Monday gaps (FX, class A)
        if: github.event.schedule == '5 22 * * 0'
        continue-on-error: true
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          CNQ_TG_TOKEN: ${{ secrets.CNQ_TG_TOKEN }}
          CNQ_TG_CHAT: ${{ secrets.CNQ_TG_CHAT }}
        run: python -m cnq.cli fx-gaps --send
      - name: Commit refreshed data
        run: |
          git config user.name "cnq-bot"
          git config user.email "cnq-bot@users.noreply.github.com"
          git add web/terminal.json web/decision.json data/agents.sqlite 2>/dev/null || true
          git commit -m "data: refresh $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "nothing to commit"
          git pull --rebase --autostash origin main || true
          git push || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
