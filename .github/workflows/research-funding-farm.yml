name: research-funding-farm
# Manual only. Funding farming on small / new perps — history check (scripts/funding_farm_study.py). Public read APIs only:
# no keys, no secrets, no orders.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe | probe2 | all"
        required: false
        default: "probe"

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      FARM_DIR: /tmp/farm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q numpy
      - name: probe
        if: inputs.mode == 'probe' || inputs.mode == 'probe2'
        run: python scripts/funding_farm_study.py ${{ inputs.mode }}
      - name: scan (Binance + Gate funding archives)
        if: inputs.mode == 'all'
        run: python scripts/funding_farm_study.py scan
      - name: prices (1-hour candles around the signals)
        if: inputs.mode == 'all'
        run: python scripts/funding_farm_study.py prices
      - name: (a) cross-venue Binance vs Gate
        if: ${{ !cancelled() && inputs.mode == 'all' }}
        run: python scripts/funding_farm_study.py sim a
      - name: (b) spot long + perp short
        if: ${{ !cancelled() && inputs.mode == 'all' }}
        run: python scripts/funding_farm_study.py sim b
      - name: (c) naked one leg
        if: ${{ !cancelled() && inputs.mode == 'all' }}
        run: python scripts/funding_farm_study.py sim c
      - name: now (cross-venue gaps today)
        if: ${{ !cancelled() && inputs.mode == 'all' }}
        run: python scripts/funding_farm_study.py now
