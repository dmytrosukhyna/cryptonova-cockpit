name: research-ladder-levels
# 20.11 (owner): data for re-planning the core ladder — order books, volume profile, swing lows, funding/OI (scripts/research/ladder_levels.py).
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/research/ladder_levels.py levels.json | sed 's/^/  /'
      - run: python scripts/research/notice_dump.py levels.json 0 10 levels
