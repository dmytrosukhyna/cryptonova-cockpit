# CRYPTO NOVA API v2 → 127.0.0.1:8090 (included inside the app.crypto-capital.app server { … } block)
location /v2/ {
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
    client_max_body_size 32k;
}

# build 45 «Разбор портфеля»: one exchange file (CSV / XLSX / PDF / screenshot) ≤ 10 MB. The body is kept in nginx's memory
# (client_body_buffer_size = the limit), so the file is never written to a temp file on disk.
location = /v2/portfolio/parse {
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
    client_max_body_size 11m;
    client_body_buffer_size 11m;
}
