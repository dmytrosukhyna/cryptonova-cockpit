name: research-experiments
# 22.11 (owner 16:18 / 16:48): the experiment program — variants of the whale copy stream (exp_variants.py), the groups /
# confirmation / contrarian families (exp_families.py), BTC events (exp_btc_events.py) and big Hyperliquid BTC positions for the
# watch list (hl_big_btc.py, weekly). Read-only: restores the state cache, never saves it.
on:
  schedule:
    - cron: "17 5 * * 1"          # weekly (Monday): the big Hyperliquid BTC positions
  workflow_dispatch:
    inputs:
      mode:
        description: "variants | families | btcevents | hlbtc | postmortem | global"
        type: choice
        options: [variants, families, btcevents, hlbtc, postmortem, global, samples, ladder, pce, hedge]
        default: variants
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Restore the state cache (read only)
        if: inputs.mode == 'variants' || inputs.mode == 'families' || inputs.mode == 'postmortem' || inputs.mode == 'ladder' || inputs.mode == 'hedge'
        uses: actions/cache/restore@v4
        with:
          path: |
            data/cnq.sqlite
            data/agents.sqlite
            data/whales_ext.sqlite
          key: cnq-state-none
          restore-keys: |
            cnq-state-
      - if: inputs.mode == 'variants'
        run: python scripts/research/exp_variants.py data/agents.sqlite exp_variants.json
      - if: inputs.mode == 'families'
        run: python scripts/research/exp_families.py data/agents.sqlite exp_families.json
      - if: inputs.mode == 'postmortem'
        run: python scripts/research/postmortem_whales.py data/agents.sqlite postmortem.json
      - if: inputs.mode == 'ladder'
        run: python scripts/research/exp_ladder.py data/agents.sqlite exp_ladder.json
      - if: inputs.mode == 'hedge'
        run: python scripts/research/hedge_pool.py data/agents.sqlite hedge_pool.json
      - if: inputs.mode == 'pce'
        run: python scripts/research/pce_squeeze.py pce_squeeze.json
      - if: inputs.mode == 'samples'
        run: python scripts/research/probe_samples.py
      - if: inputs.mode == 'global'
        run: python scripts/research/global_traders.py global_traders.json
      - if: inputs.mode == 'btcevents'
        run: python scripts/research/exp_btc_events.py exp_btc_events.json
      - if: inputs.mode == 'hlbtc' || github.event_name == 'schedule'
        run: python scripts/research/hl_big_btc.py hl_big_btc.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp-${{ inputs.mode || 'hlbtc' }}
          path: "*.json"
