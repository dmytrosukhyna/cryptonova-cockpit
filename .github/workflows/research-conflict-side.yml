name: research-conflict-side
# Manual only. RESEARCH ONLY: which side to hold when two followed traders take opposite sides of one coin (backlog п. 181,
# scripts/conflict_side_study.py). No orders, no keys. Results are published as job annotations. Nothing is committed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/conflict_side_study.py
