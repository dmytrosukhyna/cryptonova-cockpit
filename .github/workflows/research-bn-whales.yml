name: research-bn-whales
# 05.11: Binance lead traders — copy delay, stop distance / leverage, hold time (scripts/research/bn_whale_stops.py). Read-only:
# restores the state cache to read ws_trips, never saves it. Results in the run's annotations and the artifact.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Restore the state cache (read only)
        uses: actions/cache/restore@v4
        with:
          path: |
            data/cnq.sqlite
            data/agents.sqlite
            data/whales_ext.sqlite
          key: cnq-state-none
          restore-keys: |
            cnq-state-
      - run: python scripts/research/bn_whale_stops.py data/agents.sqlite bn_whale_stops.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: bn-whale-stops, path: bn_whale_stops.json }
