name: refresh-and-deploy
on:
  push:
    branches: [main]
    # the Bybit mirror on the owner's Mac and the server engine (cnq/engine.py) push these every few minutes — publish.yml shows them
    paths-ignore: ["web/bybit.json", "web/public_real.json", "web/ivan.enc.json", "web/owner.enc.json", "web/paper.json", "web/signals_feed.json", "web/engine.json",
                   "web/calendar.json", "web/quality.json", "web/altseason.json", "web/app_home.json", "web/app_btc.json",
                   "web/app_home.en.json", "web/app_home.uk.json", "web/app_home.el.json", "web/app_home.es.json",
                   "web/conveyor.json", "web/risk.json", "web/desk_select.json", "data/desk_select.jsonl",
                   "web/scorecard.json", "data/scorecard_ledger.jsonl", "data/scorecard_outcomes.jsonl", "data/scorecard/**",
                   # 28.10: the engine pushes these too (cnq/engine.py OWNED since 22.10) — without them every engine sync (~3 min) restarted
                   # this whole pipeline: ~250 runs a day instead of ~50–100, each saving another ~100 MB state cache; the Mac mirror
                   # pushes the stats-only «Иван тест» file
                   "web/okx_signal.json", "web/buy_now.json", "web/ivan_stats.json"]
  schedule:
    - cron: "*/30 * * * *"      # данные + отдел новостей каждые 30 минут (UTC)
    - cron: "13,43 * * * *"     # второе расписание со сдвигом: GitHub часто задерживает/пропускает запуски, два шанса в полчаса
    - cron: "5 22 * * 0"        # гэпы понедельника по валютам, воскресенье 22:05 UTC
    - cron: "5 17 * * 5"        # недельный обзор, пятница 17:05 UTC (20:05 Афины)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy
      - name: Restore candle store and department state
        uses: actions/cache@v4
        with:
          path: |
            data/cnq.sqlite
            data/agents.sqlite
          key: cnq-state-${{ github.run_id }}
          restore-keys: |
            cnq-state-
            cnq-db-
      - name: State guard — the spot portfolio never runs on a rolled-back database (23.10 incident, scripts/ci_state_guard.py)
        id: state
        run: python scripts/ci_state_guard.py
      - name: Pillow for post charts, edge-tts for the spoken brief
        run: pip install -q pillow edge-tts
      - name: Server engine alive? (web/engine.json fresher than 10 min → its desks are skipped here; quiet → taken back)
        id: engine
        run: python scripts/ci_engine_check.py | tee -a "$GITHUB_OUTPUT"
      - name: Candles (BingX, 15m, 400 days)
        continue-on-error: true
        run: python scripts/ci_refresh.py
      - name: Departments → web/terminal.json + web/decision.json
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CNQ_LLM_KEY: ${{ secrets.CNQ_LLM_KEY }}
          CNQ_LLM_PROVIDER: ${{ vars.CNQ_LLM_PROVIDER }}
          CNQ_LLM_MODEL: ${{ vars.CNQ_LLM_MODEL }}
          CNQ_TG_TOKEN: ${{ secrets.CNQ_TG_TOKEN }}
          CNQ_TG_CHAT: ${{ secrets.CNQ_TG_CHAT }}
          CNQ_X_BEARER: ${{ secrets.CNQ_X_BEARER }}
        run: python -m cnq.cli agents --out web
      - name: Paper desk ($10k demo futures account) → web/paper.json
        if: ${{ steps.engine.outputs.server != 'true' }}      # 19.10: the server engine (cnq/engine.py) runs this every minute
        continue-on-error: true
        run: python -m cnq.cli paper --out web
      - name: Шорт листингов (new BingX perps, short 4 h after listing; demo) → web/paper.json profiles.lst
        if: ${{ steps.engine.outputs.server != 'true' }}      # 19.10: the server engine (cnq/engine.py) runs this every minute
        continue-on-error: true
        timeout-minutes: 3
        run: python -m cnq.cli listings --out web
      - name: Сигналы CRYPTO NOVA (own daily signals — pullback + 20-day breakout with the BTC regime; demo) → web/paper.json profiles.own
        if: ${{ steps.engine.outputs.server != 'true' }}      # 19.10: the server engine (cnq/engine.py) runs this every minute
        continue-on-error: true
        timeout-minutes: 4
        run: python -m cnq.cli own --out web
      - name: Спот — анкета качества (revenue, age, calm volume; the alt basket of «ядро + альтсезон») → web/quality.json
        if: ${{ steps.engine.outputs.server != 'true' }}      # 19.10: the server engine (cnq/engine.py) runs this every minute
        continue-on-error: true
        timeout-minutes: 4
        run: python -m cnq.cli quality --out web
      - name: Нейтральная корзина (long the 10 best / short the 10 worst alts by the quality card, monthly; demo) → web/paper.json profiles.lsn
        if: ${{ steps.engine.outputs.server != 'true' }}      # 19.10: the server engine (cnq/engine.py) runs this every minute
        continue-on-error: true
        timeout-minutes: 3
        run: python -m cnq.cli lsn --out web
      - name: Портфель «ядро + альтсезон» (altseason gauge, model shares; posts to the signals channel) → web/altseason.json
        if: ${{ steps.engine.outputs.server != 'true' }}      # 19.10: the server engine (cnq/engine.py) runs this every minute
        continue-on-error: true
        timeout-minutes: 3
        env:
          CNQ_TG_TOKEN: ${{ secrets.CNQ_TG_TOKEN }}
          CNQ_SIGNALS_CHAT: ${{ secrets.CNQ_SIGNALS_CHAT }}
        run: python -m cnq.cli altport --out web
      - name: «Турбо» (the listing short ×4, BTC ×2 in «рост») — demo accounts against the +70 %/month target → web/paper.json
        if: ${{ steps.engine.outputs.server != 'true' }}      # 19.10: the server engine (cnq/engine.py) runs this every minute
        continue-on-error: true
        timeout-minutes: 2
        run: python -m cnq.cli turbo --out web
      - name: Our own signals in Cornix format (CNPTS «Сбалансированная») → web/signals_feed.json; Telegram only if CNQ_SIGNALS_CHAT is set
        if: ${{ steps.engine.outputs.server != 'true' }}      # 19.10: the server engine (cnq/engine.py) runs this every minute
        continue-on-error: true
        env:
          CNQ_TG_TOKEN: ${{ secrets.CNQ_TG_TOKEN }}
          CNQ_SIGNALS_CHAT: ${{ secrets.CNQ_SIGNALS_CHAT }}
        run: python -m cnq.cli signalfeed --out web
      - name: Funding carry → web/funding.json
        continue-on-error: true
        run: python -m cnq.cli funding --out web || true
      - name: Macro watch (DXY, US 10Y/2Y, USDJPY, oil, gold, index futures, VIX, Nikkei) → web/macro.json
        continue-on-error: true
        timeout-minutes: 3
        run: |
          pip install -q curl_cffi || true    # Yahoo answers 429 to plain urllib from Actions; Treasury/CBOE/ECB fallbacks otherwise
          python -m cnq.cli macro --out web || true
      - name: Meme desk (HL meme perps, Solana watchlist, paper «Мем-портфель») → web/memes.json
        continue-on-error: true
        timeout-minutes: 3
        run: python -m cnq.cli memes --out web || true
      - name: Arbitrage watch → web/arb.json
        continue-on-error: true
        run: python -m cnq.cli arb --out web || true
      - name: Triangle watch (3 trades inside one exchange) → web/tri.json
        continue-on-error: true
        timeout-minutes: 5
        run: python -m cnq.cli tri --out web || true
      - name: CRYPTO NOVA app signals (публичный API приложения → история, проверка ценами, профиль стратегии, правила) → web/app_signals.json
        continue-on-error: true
        timeout-minutes: 9
        run: python -m cnq.cli appsignals --out web || true
      - name: Coin research (анкета, топ-100, страх/жадность, капитализация) → web/markets.json, web/research.json
        continue-on-error: true
        run: python -m cnq.cli research --out web
      - name: Whales (Hyperliquid leaderboard positions) → web/whales.json
        continue-on-error: true
        run: python -m cnq.cli whales --out web
      - name: Top traders study (Hyperliquid + OKX lead traders, copy test, «Киты» copy desk) → web/whales_top.json
        continue-on-error: true
        timeout-minutes: 5
        run: python -m cnq.cli whalestudy --out web
      - name: Spot portfolio department → web/portfolio.json
        if: ${{ steps.state.outputs.stale != 'true' }}      # 28.10: never on a rolled-back database — the real OKX account mirrors this model
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CNQ_LLM_KEY: ${{ secrets.CNQ_LLM_KEY }}
          CNQ_LLM_PROVIDER: ${{ vars.CNQ_LLM_PROVIDER }}
          CNQ_LLM_MODEL: ${{ vars.CNQ_LLM_MODEL }}
        run: python -m cnq.cli portfolio --out web
      - name: CRYPTO NOVA портфель for the mobile app (shares, prices, the index curve) → web/app_portfolio.json
        continue-on-error: true
        timeout-minutes: 2
        run: python -m cnq.cli appportfolio --out web
      - name: CRYPTO NOVA 2.0 app feed (home, futures, spot, market) → web/app_home.json, web/app_btc.json
        if: ${{ steps.engine.outputs.server != 'true' }}
        continue-on-error: true
        run: python -m cnq.cli apphome --out web
      - name: Доход держателям (DefiLlama holders revenue → token symbols) → web/tokenomics.json
        continue-on-error: true
        timeout-minutes: 3
        run: python -m cnq.cli tokenomics --out web
      - name: Spot ideas (one table «можно брать / добрать / на небольшую сумму / ждём / не брать» from research + portfolios + memes) → web/ideas.json
        continue-on-error: true
        run: python -m cnq.cli ideas --out web || true
      - name: Lending sleeve (Aave + Sky) and sUSDe at DefiLlama's current base APY → web/yield.json
        continue-on-error: true
        timeout-minutes: 3
        run: python -m cnq.cli yield --out web
      - name: Fixed-rate futures carry — spot + short dated futures (Deribit), rate locked at entry → web/basis.json
        continue-on-error: true
        timeout-minutes: 3
        run: python -m cnq.cli basis --out web
      - name: CRYPTO NOVA Портфолио — one $10 000 demo sum split by the allocator between spot / futures / funding / fixed-rate carry / lending / sUSDe → web/capital.json
        continue-on-error: true
        run: python -m cnq.cli capital --out web
      - name: Каналы трейдеров — forecasts of public channels written down when posted, checked 1–3 days later → web/channel_watch.json; «Из каналов» (launchpads / listings / airdrops / early projects as information, no post texts) → web/channel_opps.json
        continue-on-error: true
        timeout-minutes: 5
        run: python -m cnq.cli chwatch --out web
      - name: Forecast calibration (A/B записывается и проверяется) → web/calibration.json
        continue-on-error: true
        run: python -m cnq.cli calibrate --out web
      - name: Outlook day / week / month (BTC, ETH, SOL — коридор 2 из 3, рост по режиму BTC, драйверы) → web/outlook.json
        continue-on-error: true
        run: python -m cnq.cli outlook --out web || true
      - name: Friday broadcast deck (слайды эфира; в пятницу по Киеву пересборка, иначе только блок live) → web/broadcast.json
        continue-on-error: true
        run: python -m cnq.cli broadcast --out web || true
      - name: Channel editor → @crypto_nova_news (morning / midday / evening, Kyiv time)
        continue-on-error: true
        env:
          CNQ_LLM_KEY: ${{ secrets.CNQ_LLM_KEY }}
          CNQ_LLM_PROVIDER: ${{ vars.CNQ_LLM_PROVIDER }}
          CNQ_LLM_MODEL: ${{ vars.CNQ_LLM_MODEL }}
          CNQ_TG_TOKEN: ${{ secrets.CNQ_TG_TOKEN }}
          CNQ_TG_CHAT: ${{ secrets.CNQ_TG_CHAT }}
        run: python -m cnq.cli channel --out web --send
      - name: Bot mailbox (answers /start and messages, remembers chats)
        continue-on-error: true
        env:
          CNQ_LLM_KEY: ${{ secrets.CNQ_LLM_KEY }}
          CNQ_LLM_PROVIDER: ${{ vars.CNQ_LLM_PROVIDER }}
          CNQ_TG_TOKEN: ${{ secrets.CNQ_TG_TOKEN }}
          CNQ_TG_OWNER: ${{ vars.CNQ_TG_OWNER }}
          CNQ_TG_CHAT: ${{ secrets.CNQ_TG_CHAT }}
        run: python -m cnq.cli botmail
      - name: Weekly review (Fridays; first run writes one so the panel is not empty) → web/weekly.json
        continue-on-error: true
        env:
          CNQ_TG_TOKEN: ${{ secrets.CNQ_TG_TOKEN }}
          CNQ_TG_CHAT: ${{ secrets.CNQ_TG_CHAT }}
        run: python -m cnq.cli weekly --out web --send
      - name: Monday gaps (FX, class A)
        if: github.event.schedule == '5 22 * * 0'
        continue-on-error: true
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          CNQ_TG_TOKEN: ${{ secrets.CNQ_TG_TOKEN }}
          CNQ_TG_CHAT: ${{ secrets.CNQ_TG_CHAT }}
        run: python -m cnq.cli fx-gaps --send
      - name: Spoken brief (neural voice) → web/brief.mp3 + web/brief.json
        continue-on-error: true
        env:
          CNQ_OWNER_NAME: ${{ vars.CNQ_OWNER_NAME }}
        run: python -m cnq.cli voice --out web
      - name: Trading journal → web/journal.json
        continue-on-error: true
        run: python scripts/ci_journal.py
      - name: Version stamp (panel shows build time; offers reload when a new build is published)
        run: python scripts/ci_version.py
      - name: Order-book snapshots (BingX) → web/books.json
        continue-on-error: true
        run: python scripts/ci_books.py
      - name: Status file for the panel
        run: python scripts/ci_status.py
      - name: VIP feeds (read-only) → web/spot_pipeline.json, web/strategies.json, web/opportunities.json, web/system_status.json
        continue-on-error: true
        timeout-minutes: 2
        run: python -m cnq.cli vipfeeds --out web
      - name: Commit refreshed data (state also survives in the cache)
        continue-on-error: true
        run: |
          git config user.name "cnq-bot"
          git config user.email "cnq-bot@users.noreply.github.com"
          for f in web/terminal.json web/decision.json web/portfolio.json web/app_portfolio.json web/app_home.json web/app_home.en.json web/app_home.uk.json web/app_home.el.json web/app_home.es.json web/app_btc.json web/altseason.json web/quality.json web/paper.json web/funding.json web/macro.json web/memes.json web/ideas.json web/arb.json web/tri.json web/calendar.json web/weekly.json web/calibration.json web/outlook.json web/broadcast.json web/app_signals.json web/markets.json web/research.json web/whales.json web/whales_top.json web/signals_feed.json web/capital.json web/yield.json web/basis.json web/tokenomics.json web/channel_watch.json web/channel_opps.json web/books.json web/version.json web/status.json web/brief.json web/brief.mp3 web/spot_pipeline.json web/strategies.json web/opportunities.json web/system_status.json; do [ -f "$f" ] && git add "$f"; done
          # 20.10: data/agents.sqlite reached GitHub's 100 MB file limit (whale study candles/fills) — every push after 09:44 UTC was
          # rejected, so no data reached main for hours. Past 95 MB the database stays in the Actions cache only (it is restored from there).
          sz=$(stat -c %s data/agents.sqlite 2>/dev/null || echo 0)
          if [ "$sz" -lt 95000000 ]; then git add data/agents.sqlite; else echo "::warning title=agents.sqlite::$((sz/1000000)) MB — kept in the cache only, not committed (GitHub limit 100 MB)"; fi
          git status --short | head -20
          git commit -m "data: refresh $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "nothing to commit"
          for i in 1 2 3; do git fetch origin main && git rebase --autostash -X theirs origin/main && git push origin HEAD:main && break || { echo "::warning title=push::attempt $i failed"; git rebase --abort || true; sleep 15; }; done
      - name: Publish web/ to gh-pages branch (works without any Pages setting)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          force_orphan: true
          cname: cryptonova.vip
