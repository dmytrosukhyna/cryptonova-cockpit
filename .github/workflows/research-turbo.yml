name: research-turbo
# Manual only. «Турбо»: how far our proven edges go with more size / leverage — month by month (scripts/turbo_study.py).
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy
      - run: python scripts/turbo_study.py
