name: tts-ru-probe
# TEMPORARY (29.10.2026, owner 15:42: a good neural female voice is fine, delays are worse): the Russian female neural voices
# (Svetlana, Dariya if Edge has it) next to Dmitry and Brian Multilingual: 3 Russian sentences of the report / NOVA AI answers
# (numbers, $, BTC/ETH) × ROUNDS spaced-out rounds, one bare edge-tts call each (no retry) → success %, latency; every distinct mp3
# is transcribed with faster-whisper (small, CPU) and compared with the words given (WER). mp3s + results.md/json → the artifact.
# Removed after the probe. Changes nothing on the server.
on:
  workflow_dispatch:
    inputs:
      rounds: { description: "rounds", default: "10" }
      pause: { description: "seconds between rounds", default: "20" }
      from_run: { description: "reuse the mp3s + synth.json of this earlier run (skip the synthesis)", default: "" }
      skip_tx: { description: "skip the transcription (summary only)", default: "" }

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q "edge-tts>=7,<8" faster-whisper num2words imageio-ffmpeg
      - uses: actions/download-artifact@v4
        if: inputs.from_run != ''
        with: { name: tts-ru-probe, path: out, run-id: "${{ inputs.from_run }}", github-token: "${{ github.token }}" }
      - name: synthesize (every voice × 3 sentences × rounds)
        if: inputs.from_run == ''
        env: { ROUNDS: "${{ inputs.rounds }}", PAUSE: "${{ inputs.pause }}" }
        run: |
          python - <<'PY'
          import asyncio, hashlib, json, os, random, sys, time
          import edge_tts
          sys.path.insert(0, ".")
          from cnq.api import tts
          ROUNDS, PAUSE = int(os.environ.get("ROUNDS") or 10), float(os.environ.get("PAUSE") or 20)
          S = [  # as the app sends them: the report (amounts in words for the ear, digits, NBSP thousands) and a NOVA AI answer ($, %, BTC/ETH)
              "Публичный портфель CRYPTO NOVA сейчас — 9 773 доллара. За сегодня минус 139 долларов, это минус 1,4 процента. "
              "С 22 октября — минус 251 доллар, это минус 2,5 процента.",
              "Биткоин стоит 80 058 долларов, за сутки минус 1,7 процента. Открытых фьючерсных сделок: 3, у каждой стоп на бирже. "
              "Последнее действие системы, 29 октября: открыта сделка по NEAR.",
              "Я NOVA AI. Если вложить $500 в BTC и $300 в ETH, то при падении рынка на 20% портфель потеряет около $160. "
              "Поэтому система держит стоп на бирже и рискует не больше 2% счёта в одной сделке.",
          ]
          allv = asyncio.run(edge_tts.list_voices())
          multi = [v for v in allv if v["ShortName"].startswith("ru-") or v["ShortName"].split("-")[0] in ("uk", "el", "es") or v["ShortName"].startswith("en-US")]
          print("::notice title=voices ru uk el es::" + " · ".join(f"{v['ShortName']} ({v['Gender']})" for v in multi if not v["ShortName"].startswith("en-")))
          print("::notice title=voices en-US::" + " · ".join(f"{v['ShortName'][6:]} ({v['Gender'][0]})" for v in multi if v["ShortName"].startswith("en-US")))
          have = {v["ShortName"] for v in allv}
          VOICES = [v for v in ("ru-RU-DmitryNeural", "ru-RU-SvetlanaNeural", "ru-RU-DariyaNeural", "en-US-BrianMultilingualNeural") if v in have]
          print("::notice title=probed::" + " · ".join(VOICES) + (" · ru-RU-DariyaNeural is NOT in Edge's list" if "ru-RU-DariyaNeural" not in have else ""))
          print("voices:", VOICES, flush=True)
          os.makedirs("out/mp3", exist_ok=True)

          FIRST = {}

          async def one(text, voice):
              buf, t0 = bytearray(), time.time()
              async for ch in edge_tts.Communicate(text, voice, rate=tts.RATE).stream():
                  if ch.get("type") == "audio" and ch.get("data"):
                      if not buf:
                          FIRST["ms"] = round((time.time() - t0) * 1000)
                      buf += ch["data"]
              return bytes(buf)

          rows = []
          for r in range(ROUNDS):
              order = VOICES[:]
              random.shuffle(order)
              for v in order:
                  for i, text in enumerate(S):
                      say = tts.spoken(text, "ru")         # exactly what the server sends the voice
                      t0 = time.time()
                      err, data = None, b""
                      FIRST.clear()
                      try:
                          data = asyncio.run(asyncio.wait_for(one(say, v), 30))
                          if len(data) <= 1000:
                              err = "no audio (%d B)" % len(data)
                      except Exception as e:  # noqa: BLE001
                          err = f"{type(e).__name__}: {str(e)[:90]}"
                      ms = round((time.time() - t0) * 1000)
                      h = hashlib.sha256(data).hexdigest()[:12] if not err else None
                      if h:
                          p = f"out/mp3/{v}__s{i + 1}__{h}.mp3"
                          if not os.path.exists(p):
                              open(p, "wb").write(data)
                      rows.append({"round": r + 1, "voice": v, "s": i + 1, "ok": not err, "ms": ms, "bytes": len(data), "hash": h,
                                   "err": err, "t": int(t0), "first": FIRST.get("ms")})
                      print(f"r{r + 1} {v:34s} s{i + 1} {'ok ' if not err else 'ERR'} {ms:6d} ms {len(data):7d} B {err or ''}", flush=True)
              if r + 1 < ROUNDS:
                  time.sleep(PAUSE)
          json.dump({"sentences": S, "spoken": [tts.spoken(x, "ru") for x in S], "voices": VOICES, "rows": rows,
                     "listed": [(v["ShortName"], v["Gender"]) for v in multi]},
                    open("out/synth.json", "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          PY
      - name: synthesis summary
        run: |
          ls out out/mp3 | head -80
          python - <<'PY'
          import json, statistics
          d = json.load(open("out/synth.json", encoding="utf-8"))
          for v in d["voices"]:
              rv = [x for x in d["rows"] if x["voice"] == v]
              ok = sorted(x["ms"] for x in rv if x["ok"])
              fa = sorted(x["first"] for x in rv if x.get("first") is not None)
              errs = sorted({x["err"] for x in rv if x["err"]})
              print(f"::notice title=synth {v}::{len(ok)}/{len(rv)} ok · first audio median {statistics.median(fa) if fa else '-'} ms, p90 {fa[int(0.9 * (len(fa) - 1))] if fa else '-'} · total median {statistics.median(ok) if ok else '-'} ms · "
                    f"p90 {ok[int(0.9 * (len(ok) - 1))] if ok else '-'} ms · per sentence "
                    + " ".join(f"s{k}:{sum(1 for x in rv if x['ok'] and x['s'] == k)}/{sum(1 for x in rv if x['s'] == k)}" for k in (1, 2, 3))
                    + f" · errors {errs[:2]} · failed ms {sorted(x['ms'] for x in rv if not x['ok'])}")
          PY
      - name: transcribe (faster-whisper small, CPU) and score
        if: inputs.skip_tx == ''
        run: |
          python - <<'PY' || { echo "::error title=transcribe::$(tail -c 900 tx.err | tr '\n' ' ')"; exit 1; }
          import sys
          sys.stderr = open("tx.err", "w")
          import glob, json, os, re, statistics, subprocess, time
          import numpy as np
          import imageio_ffmpeg
          from faster_whisper import WhisperModel
          FFMPEG = imageio_ffmpeg.get_ffmpeg_exe()   # the runner has no ffmpeg
          from num2words import num2words
          d = json.load(open("out/synth.json", encoding="utf-8"))
          ref = d["spoken"]

          def words_num(m):
              s = m.group(0).replace(" ", "").replace(" ", "")
              try:
                  if "," in s or "." in s:
                      a, b = re.split(r"[.,]", s, maxsplit=1)
                      return f" {num2words(int(a), lang='ru')} целых {num2words(int(b), lang='ru')} "
                  return f" {num2words(int(s), lang='ru')} "
              except Exception:  # noqa: BLE001
                  return f" {s} "

          LEX = [(r"\$\s?(\d+(?:[\s ]\d{3})*)", r"\1 доллар"), (r"(\d)\s?%", r"\1 процент"), (r"\bдоллар\w*", "доллар"),
                 (r"\bпроцент\w*", "процент"), (r"\bцел\w*", "целых"), (r"\bдесят\w*\b", ""),
                 (r"\b(btc|бтс|би ?ти ?си|бэ ?тэ ?цэ)\b", "btc"), (r"\b(eth|етх|эф|ит|и ?ти ?эйч|э ?тэ ?ха)\b", "eth"),
                 (r"\b(near|нир|неар)\b", "near"), (r"\bcrypto\b", "крипто"), (r"\bnova\b", "нова"), (r"\bai\b", "")]

          def norm(s):
              s = s.replace("́", "").lower().replace("ё", "е").replace("—", " ").replace("-", " ")
              for a, b in LEX[:2]:
                  s = re.sub(a, b, s)
              s = re.sub(r"(?<!\d)(\d{1,3}(?:[\s ]\d{3})+|\d+(?:[.,]\d+)?)(?!\d)", words_num, s)
              s = re.sub(r"[^\w\s]", " ", s)
              for a, b in LEX[2:]:
                  s = re.sub(a, b, s)
              return s.split()

          def wer(r, h):
              r, h = norm(r), norm(h)
              D = list(range(len(h) + 1))
              for i in range(1, len(r) + 1):
                  prev, D[0] = D[0], i
                  for j in range(1, len(h) + 1):
                      cur = D[j]
                      D[j] = min(D[j] + 1, D[j - 1] + 1, prev + (r[i - 1] != h[j - 1]))
                      prev = cur
              return D[len(h)] / max(1, len(r))

          m = WhisperModel("small", device="cpu", compute_type="int8")
          tr = {}
          for p in sorted(glob.glob("out/mp3/*.mp3")):
              voice, s, h = os.path.basename(p)[:-4].split("__")
              t0 = time.time()
              # ffmpeg decodes (faster-whisper's own PyAV decoder breaks with the newest av: «metadata_errors»)
              pcm = subprocess.run([FFMPEG, "-nostdin", "-loglevel", "error", "-i", p, "-f", "f32le", "-ac", "1", "-ar", "16000", "-"],
                                   capture_output=True, check=True).stdout
              segs, info = m.transcribe(np.frombuffer(pcm, np.float32), language="ru", beam_size=5, condition_on_previous_text=False)
              text = " ".join(x.text.strip() for x in segs)
              k = int(s[1:])
              tr[h] = {"voice": voice, "s": k, "text": text, "wer": round(wer(ref[k - 1], text), 3), "dur": round(info.duration, 1)}
              print(f"{voice:34s} s{k} WER {tr[h]['wer']:.3f} {info.duration:5.1f}s audio ({time.time() - t0:.1f}s) | {text}", flush=True)

          rows = d["rows"]
          table, out = [], {}
          for v in d["voices"]:
              rv = [x for x in rows if x["voice"] == v]
              ok = [x for x in rv if x["ok"]]
              ms = sorted(x["ms"] for x in ok)
              wers = [tr[x["hash"]]["wer"] for x in ok if x["hash"] in tr]
              per_s = {k: [tr[x["hash"]]["wer"] for x in ok if x["s"] == k and x["hash"] in tr] for k in (1, 2, 3)}
              out[v] = {"n": len(rv), "ok": len(ok), "pct": round(100 * len(ok) / max(1, len(rv)), 1),
                        "ms_med": statistics.median(ms) if ms else None, "ms_p90": ms[int(0.9 * (len(ms) - 1))] if ms else None,
                        "wer_mean": round(statistics.mean(wers), 3) if wers else None,
                        "wer_s": {k: (round(statistics.mean(w), 3) if w else None) for k, w in per_s.items()},
                        "distinct_mp3": len({x["hash"] for x in ok}),
                        "errors": sorted({x["err"] for x in rv if x["err"]})[:3],
                        "transcripts": {k: next((tr[x["hash"]]["text"] for x in ok if x["s"] == k and x["hash"] in tr), None) for k in (1, 2, 3)}}
              o = out[v]
              table.append(f"| {v} | {o['ok']}/{o['n']} ({o['pct']}%) | {o['ms_med'] or '-'} / {o['ms_p90'] or '-'} | "
                           f"{o['wer_mean'] if o['wer_mean'] is not None else '-'} | "
                           + " / ".join(str(o['wer_s'][k]) for k in (1, 2, 3)) + " |")
          md = ["| voice | success | latency ms (median / p90) | WER mean | WER s1 / s2 / s3 |", "|---|---|---|---|---|"] + table
          md += ["", "## input (spoken form)"] + [f"{i + 1}. {s}" for i, s in enumerate(ref)]
          md += ["", "## transcripts (first success per sentence)"]
          for v, o in out.items():
              md += [f"### {v}"] + [f"- s{k}: {o['transcripts'][k]}" for k in (1, 2, 3)] + ([f"- errors: {o['errors']}"] if o["errors"] else [])
          open("out/results.md", "w", encoding="utf-8").write("\n".join(md) + "\n")
          json.dump({"summary": out, "transcripts": tr}, open("out/results.json", "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          print("\n".join(md))
          print("::notice title=table::" + " ".join(f"{v}: {o['ok']}/{o['n']} {o['pct']}% · {o['ms_med']} ms med, {o['ms_p90']} p90 · WER {o['wer_mean']} {list(o['wer_s'].values())} ·" for v, o in out.items()))
          for v, o in list(out.items())[:9]:
              print(f"::notice title=tx {v}::" + " ‖ ".join(f"s{k}: {o['transcripts'][k]}" for k in (1, 2, 3))[:1800] + (f" ‖ errors {o['errors']}" if o["errors"] else ""))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tts-ru-probe
          path: out/
          retention-days: 14
