name: research-analyze
# Manual only. Runs scripts/<script> (default universe_test.py) on the okx15m artifact of a research-data run and publishes the
# result tables as the job summary + annotations (readable through the GitHub API; artifact downloads are
# not reachable from the research container). Nothing is committed.
on:
  workflow_dispatch:
    inputs:
      data_run_id:
        description: "run id of a successful research-data run (artifact okx15m)"
        required: true
      script:
        description: "analysis script in scripts/ (takes the .npz path and --md)"
        required: false
        default: "universe_test.py"

permissions:
  contents: read
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy
      - uses: actions/download-artifact@v4
        with:
          name: okx15m
          run-id: ${{ inputs.data_run_id }}
          github-token: ${{ github.token }}
      - name: Analysis script (default universe_test.py — rules B + E)
        env: { SCRIPT: "${{ inputs.script }}" }
        run: |
          case "$SCRIPT" in *[!A-Za-z0-9_.-]*|"") echo "bad script name"; exit 1;; esac
          python "scripts/$SCRIPT" okx15m.npz --md results.md
      - name: Publish results
        if: always()
        run: |
          cat results.md >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          s = open("results.md").read(); n = 3000
          parts = [s[i:i + n] for i in range(0, len(s), n)][:10]
          for j, p in enumerate(parts):
              p = p.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::notice title=results {j + 1}/{len(parts)}::{p}")
          PY
