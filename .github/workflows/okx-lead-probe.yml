name: okx-lead-probe
# 22.11: is our OKX lead-trader profile (the server's copy_url) live? OKX's public copy-trading API, no keys. Prints only.
on:
  push:
    branches: ["research/okxlead**"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/okx_lead_probe.py
